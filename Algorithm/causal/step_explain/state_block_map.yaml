# state_block_map.yaml
# 状态维语义分块配置
#
# 将 s_0…s_7（8 维状态）按业务语义划分为若干「块」。
# 每块包含：
#   dims : 状态向量中的维度索引（从 0 开始）
#   desc : 简短中文描述（写入解释段落）
#
# 修改建议：
#   - 根据你的实际环境调整 dims 的含义和分块边界
#   - 增加或删除块，dims 列表总计应覆盖 0~7 所有维度
#   - 同一维度可以出现在多个块（做交叉分析），但通常不建议
#
# 当前分块基于 LLdV3 环境的观测含义（仅供参考，请按实际确认）：
#   s_0, s_1 — 自身位置（x, y）
#   s_2, s_3 — 自身姿态（角度偏差）
#   s_4, s_5 — 自身速度分量
#   s_6, s_7 — 目标/威胁离散标志（通常为 0/1 或枚举值）

blocks:
  本机位置:
    dims: [0, 1]
    desc: "自身位置坐标 (s_0, s_1)"

  本机姿态:
    dims: [2, 3]
    desc: "自身姿态角与角度偏差 (s_2, s_3)"

  本机速度:
    dims: [4, 5]
    desc: "速度分量 (s_4, s_5)"

  目标状态:
    dims: [6, 7]
    desc: "目标/威胁离散标志 (s_6, s_7)"
